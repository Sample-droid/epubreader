<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>EPUB Reader</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="top-bar" id="top-bar">
        <button id="toc-btn" class="icon-btn" title="Table of Contents" aria-controls="toc-drawer" aria-expanded="false">&#9776;</button>
        <h1 id="book-title">Library</h1>
        <label for="file-input" class="upload-btn" id="upload-label">
            Open EPUB
        </label>
        <input type="file" id="file-input" accept=".epub" />
    </header>

    <!-- Side Drawer for Table of Contents -->
    <div id="toc-drawer" class="toc-drawer" aria-hidden="true">
        <div class="toc-header">
            <h3>Table of Contents</h3>
            <button id="close-toc" class="icon-btn" aria-label="Close Table of Contents">&times;</button>
        </div>
        <div id="toc-list"></div>
    </div>
    <div id="toc-overlay" class="toc-overlay"></div>

    <!-- Reader Area -->
    <main id="viewer" class="viewer-container">
        <div id="placeholder-text">
            <h2>Welcome to your Web Reader</h2>
            <p>Tap "Open EPUB" above to load a novel.</p>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <footer class="bottom-bar" id="bottom-bar">
        <button id="prev-btn" disabled>&larr; Prev</button>
        <div id="chapter-title">Chapter...</div>
        <button id="next-btn" disabled>Next &rarr;</button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
