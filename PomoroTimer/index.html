<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina ePub Reader</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mobile Backdrop Overlay -->
    <div id="backdrop" class="backdrop hidden"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar collapsed" id="sidebar">
            <div class="brand">
                <div class="brand-icon">📖</div>
                <span>LUMINA READER</span>
            </div>

            <div class="book-info">
                <h2 id="bookTitle">No Book Loaded</h2>
                <p id="bookAuthor">Upload an .epub file to start reading</p>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-controls">
                <button class="tab-btn active" data-tab="toc">Contents</button>
                <button class="tab-btn" data-tab="settings">Settings</button>
            </div>

            <!-- Tab 1: Table of Contents -->
            <div class="tab-content active" id="tab-toc">
                <div class="toc-list" id="tocList">
                    <p class="empty-state-text">Chapters will appear here after loading a book.</p>
                </div>
            </div>

            <!-- Tab 2: Reader Settings -->
            <div class="tab-content" id="tab-settings">
                <div class="control-group">
                    <span class="group-label">Theme</span>
                    <div class="theme-grid">
                        <button class="theme-btn active" data-theme="dark" style="background:#121215; color:#f4f4f5;">Dark</button>
                        <button class="theme-btn" data-theme="sepia" style="background:#fbf0d9; color:#5f4b32;">Sepia</button>
                        <button class="theme-btn" data-theme="light" style="background:#ffffff; color:#09090b;">Light</button>
                    </div>
                </div>

                <div class="control-group">
                    <span class="group-label">Font Size</span>
                    <div class="font-size-controls">
                        <button class="icon-btn" id="decFont">-</button>
                        <span id="fontSizeDisplay">100%</span>
                        <button class="icon-btn" id="incFont">+</button>
                    </div>
                </div>

                <div class="control-group">
                    <span class="group-label">Font Family</span>
                    <select id="fontFamilySelect" class="select-input">
                        <option value="Plus Jakarta Sans">Sans-Serif</option>
                        <option value="Georgia">Serif</option>
                        <option value="Courier New">Monospace</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- Main Viewport -->
        <main class="viewport">
            <header class="top-bar">
                <button class="icon-btn" id="toggleSidebar" aria-label="Toggle Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>

                <div class="actions">
                    <label for="epubFileInput" class="primary-btn">
                        <span>Open EPUB</span>
                        <input type="file" id="epubFileInput" accept=".epub">
                    </label>
                </div>
            </header>

            <!-- Stage Area -->
            <div class="reader-stage" id="readerStage">
                <div class="drop-zone" id="dropZone">
                    <div class="drop-icon">📚</div>
                    <h3>Select or Drop an EPUB File</h3>
                    <p>Supported format: .epub</p>
                </div>

                <!-- EPUB Viewer -->
                <div id="viewer" class="epub-viewer hidden"></div>

                <!-- Nav Controls -->
                <button class="nav-arrow left hidden" id="prevPage" aria-label="Previous Page">‹</button>
                <button class="nav-arrow right hidden" id="nextPage" aria-label="Next Page">›</button>
            </div>

            <!-- Footer Progress -->
            <footer class="reader-footer">
                <span id="progressPercent">0%</span>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
