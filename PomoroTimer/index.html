<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Reader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    
    <!-- Required ePub & JSZip Engine Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Floating Glass Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6.5 6H20"/></svg>
                </div>
                <span>LUMINA READER</span>
            </div>

            <!-- Meta Details -->
            <div id="bookInfo" class="book-info hidden">
                <h2 id="bookTitle">Book Title</h2>
                <p id="bookAuthor">Author Name</p>
            </div>

            <!-- Sidebar Navigation Tabs -->
            <div class="tab-controls">
                <button id="tocTabBtn" class="tab-btn active">Contents</button>
                <button id="settingsTabBtn" class="tab-btn">Display</button>
            </div>

            <!-- Tab Content: Table of Contents -->
            <div id="tocView" class="tab-content active">
                <div id="tocList" class="toc-list">
                    <p class="empty-state-text">No book loaded</p>
                </div>
            </div>

            <!-- Tab Content: Settings & Typography -->
            <div id="settingsView" class="tab-content">
                <div class="control-group">
                    <span class="group-label">Theme</span>
                    <div class="theme-grid">
                        <button class="theme-btn active" data-theme="dark" style="background:#121215; color:#f4f4f5;">Dark</button>
                        <button class="theme-btn" data-theme="sepia" style="background:#fcf8ed; color:#433422;">Sepia</button>
                        <button class="theme-btn" data-theme="light" style="background:#ffffff; color:#18181b;">Light</button>
                    </div>
                </div>

                <div class="control-group">
                    <span class="group-label">Font Size</span>
                    <div class="font-size-controls">
                        <button id="decreaseFont" class="icon-btn">A-</button>
                        <span id="fontSizeDisplay">100%</span>
                        <button id="increaseFont" class="icon-btn">A+</button>
                    </div>
                </div>

                <div class="control-group">
                    <span class="group-label">Font Family</span>
                    <select id="fontFamilySelect" class="select-input">
                        <option value="Plus Jakarta Sans">Sans-Serif (Modern)</option>
                        <option value="Merriweather">Serif (Book)</option>
                        <option value="monospace">Monospace</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- Main Reading Viewport -->
        <main class="viewport">
            <!-- Header Toolbar -->
            <header class="top-bar">
                <button id="toggleSidebarBtn" class="icon-btn" title="Toggle Sidebar (S)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
                </button>

                <div class="file-picker-wrapper">
                    <label for="epubFileInput" class="primary-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                        Open ePub
                    </label>
                    <input type="file" id="epubFileInput" accept=".epub">
                </div>
            </header>

            <!-- Reader Stage Container -->
            <div id="readerStage" class="reader-stage">
                <!-- Dropzone Placeholder -->
                <div id="dropZone" class="drop-zone">
                    <div class="drop-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 13v8M4 14.896A6 6 0 0 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="m8 17 4-4 4 4"/></svg>
                    </div>
                    <h3>Drag & Drop your .epub file here</h3>
                    <p>or click "Open ePub" above to start reading</p>
                </div>

                <!-- epub.js Mount Target -->
                <div id="viewer" class="epub-viewer hidden"></div>

                <!-- Side Floating Page Turn Buttons -->
                <button id="prevBtn" class="nav-arrow left hidden" title="Previous Page (Left Arrow)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button id="nextBtn" class="nav-arrow right hidden" title="Next Page (Right Arrow)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>

            <!-- Footer Location Bar -->
            <footer id="readerFooter" class="reader-footer hidden">
                <span id="pageProgress">0%</span>
                <div class="progress-bar-track">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
