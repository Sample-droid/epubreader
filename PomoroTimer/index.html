<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina Mobile Reader</title>
    
    <!-- JSZip Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            color: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            height: 50px;
            background-color: #111111;
            border-bottom: 1px solid #222222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            position: relative;
            z-index: 10;
        }

        .title-text {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 55%;
        }

        .bar-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .upload-btn {
            background-color: #ffffff;
            color: #000000;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 16px;
            cursor: pointer;
        }

        .upload-btn input {
            display: none;
        }

        /* Reading Area */
        .scroll-container {
            height: calc(100vh - 50px);
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 20px 16px 60px 16px;
        }

        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #888888;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state h2 {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 13px;
        }

        /* Reader Content Overrides */
        .book-content {
            max-width: 680px;
            margin: 0 auto;
        }

        .chapter-block {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #222222;
        }

        .chapter-block *,
        .chapter-block p,
        .chapter-block div,
        .chapter-block span {
            background-color: transparent !important;
            color: #e5e5e5 !important;
            font-family: inherit !important;
            line-height: 1.6 !important;
            font-size: 17px !important;
        }

        .chapter-block h1,
        .chapter-block h2,
        .chapter-block h3,
        .chapter-block h4 {
            color: #ffffff !important;
            margin: 24px 0 12px 0 !important;
        }

        .chapter-block h1 { font-size: 22px !important; }
        .chapter-block h2 { font-size: 20px !important; }
        .chapter-block h3 { font-size: 18px !important; }

        .chapter-block img {
            max-width: 100% !important;
            height: auto !important;
            display: block !important;
            margin: 16px auto !important;
            border-radius: 4px;
        }

        /* Drawer Overlay */
        .drawer-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
        }

        .toc-drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 80%;
            max-width: 300px;
            height: 100%;
            background-color: #111111;
            border-right: 1px solid #222222;
            z-index: 101;
            transform: translateX(-100%);
            transition: transform 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
        }

        .toc-drawer.open { transform: translateX(0); }
        .drawer-backdrop.open { display: block; }

        .drawer-header {
            padding: 16px;
            border-bottom: 1px solid #222222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        .toc-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .toc-item {
            padding: 12px;
            font-size: 14px;
            color: #cccccc;
            border-bottom: 1px solid #1a1a1a;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toc-item:active {
            background-color: #222222;
            color: #ffffff;
        }

        .empty-msg {
            font-size: 12px;
            color: #666666;
            text-align: center;
            margin-top: 20px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Drawer Overlay -->
    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    
    <aside id="tocDrawer" class="toc-drawer">
        <div class="drawer-header">
            <h3>Chapters</h3>
            <button id="closeDrawerBtn" class="close-btn">✕</button>
        </div>
        <div id="tocList" class="toc-list">
            <p class="empty-msg">No chapters loaded.</p>
        </div>
    </aside>

    <!-- Top Bar -->
    <header class="top-bar">
        <button id="openDrawerBtn" class="bar-btn">☰</button>
        <span id="bookTitle" class="title-text">Lumina Reader</span>
        <label class="upload-btn">
            Open
            <input type="file" id="epubInput" accept="*/*">
        </label>
    </header>

    <!-- Main Container -->
    <main id="scrollContainer" class="scroll-container">
        <div id="emptyState" class="empty-state">
            <div class="icon">📖</div>
            <h2>Tap "Open" to Load an ePub</h2>
            <p>Pure black theme built for mobile vertical scrolling.</p>
        </div>

        <div id="bookContent" class="book-content hidden"></div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const epubInput = document.getElementById('epubInput');
            const scrollContainer = document.getElementById('scrollContainer');
            const emptyState = document.getElementById('emptyState');
            const bookContent = document.getElementById('bookContent');
            const bookTitle = document.getElementById('bookTitle');
            
            const tocDrawer = document.getElementById('tocDrawer');
            const drawerBackdrop = document.getElementById('drawerBackdrop');
            const openDrawerBtn = document.getElementById('openDrawerBtn');
            const closeDrawerBtn = document.getElementById('closeDrawerBtn');
            const tocList = document.getElementById('tocList');

            if (typeof JSZip === 'undefined') {
                alert("JSZip failed to load. Check your mobile network connection.");
                return;
            }

            function openDrawer() {
                tocDrawer.classList.add('open');
                drawerBackdrop.classList.add('open');
            }

            function closeDrawer() {
                tocDrawer.classList.remove('open');
                drawerBackdrop.classList.remove('open');
            }

            openDrawerBtn.addEventListener('click', openDrawer);
            closeDrawerBtn.addEventListener('click', closeDrawer);
            drawerBackdrop.addEventListener('click', closeDrawer);

            epubInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                try {
                    await processEpubFile(file);
                } catch (err) {
                    alert("Reader Error: " + err.message);
                }
            });

            async function processEpubFile(file) {
                emptyState.classList.add('hidden');
                bookContent.classList.remove('hidden');
                bookContent.innerHTML = '<p style="text-align:center; padding:40px; color:#888;">Unpacking book...</p>';
                
                let zip;
                try {
                    zip = await JSZip.loadAsync(file);
                } catch (err) {
                    throw new Error("Cannot open file. Make sure it is an unencrypted .epub file.");
                }

                const containerFile = zip.file("META-INF/container.xml");
                if (!containerFile) throw new Error("Invalid ePub archive format.");

                const containerXmlStr = await containerFile.async("text");
                const parser = new DOMParser();
                const containerDoc = parser.parseFromString(containerXmlStr, "text/xml");
                const rootfileEl = containerDoc.querySelector("rootfile");
                if (!rootfileEl) throw new Error("Missing rootfile inside ePub.");

                const opfPath = rootfileEl.getAttribute("full-path");
                const opfDir = opfPath.includes("/") ? opfPath.substring(0, opfPath.lastIndexOf("/") + 1) : "";

                const opfFile = zip.file(opfPath);
                if (!opfFile) throw new Error("OPF manifest file not found.");

                const opfStr = await opfFile.async("text");
                const opfDoc = parser.parseFromString(opfStr, "text/xml");

                const titleEl = opfDoc.querySelector("title");
                if (titleEl) bookTitle.textContent = titleEl.textContent;

                const manifestItems = {};
                opfDoc.querySelectorAll("manifest > item, item").forEach(item => {
                    const id = item.getAttribute("id");
                    const href = item.getAttribute("href");
                    if (id && href) manifestItems[id] = href;
                });

                const spineItemIds = [];
                opfDoc.querySelectorAll("spine > itemref, itemref").forEach(item => {
                    const idref = item.getAttribute("idref");
                    if (idref) spineItemIds.push(idref);
                });

                bookContent.innerHTML = '';
                tocList.innerHTML = '';

                let loadedChapters = 0;

                for (let i = 0; i < spineItemIds.length; i++) {
                    const id = spineItemIds[i];
                    const relativeHref = manifestItems[id];
                    if (!relativeHref) continue;

                    const fullPath = resolvePath(opfDir, relativeHref);
                    const fileRef = zip.file(fullPath);
                    if (!fileRef) continue;

                    const htmlContent = await fileRef.async("text");
                    const chapterDoc = parser.parseFromString(htmlContent, "text/html");

                    let chapterHeading = `Chapter ${i + 1}`;
                    const headingEl = chapterDoc.querySelector('h1, h2, h3, title');
                    if (headingEl && headingEl.textContent.trim()) {
                        chapterHeading = headingEl.textContent.trim();
                    }

                    // Extract & replace embedded images
                    const images = chapterDoc.querySelectorAll('img');
                    for (let img of images) {
                        const src = img.getAttribute('src');
                        if (src && !src.startsWith('http') && !src.startsWith('data:')) {
                            const chapterDir = fullPath.includes("/") ? fullPath.substring(0, fullPath.lastIndexOf("/") + 1) : "";
                            const imgFullPath = resolvePath(chapterDir, src);
                            const imgFile = zip.file(imgFullPath);
                            
                            if (imgFile) {
                                try {
                                    const blob = await imgFile.async("blob");
                                    const blobUrl = URL.createObjectURL(blob);
                                    img.setAttribute('src', blobUrl);
                                } catch (e) {}
                            }
                        }
                    }

                    const chapterBlock = document.createElement('section');
                    chapterBlock.className = 'chapter-block';
                    chapterBlock.id = `chapter-${i}`;
                    chapterBlock.innerHTML = chapterDoc.body ? chapterDoc.body.innerHTML : htmlContent;

                    bookContent.appendChild(chapterBlock);
                    loadedChapters++;

                    const tocItem = document.createElement('div');
                    tocItem.className = 'toc-item';
                    tocItem.textContent = chapterHeading;
                    tocItem.addEventListener('click', () => {
                        chapterBlock.scrollIntoView({ behavior: 'smooth' });
                        closeDrawer();
                    });
                    tocList.appendChild(tocItem);
                }

                if (loadedChapters === 0) {
                    throw new Error("No readable chapters found inside this ePub.");
                }

                scrollContainer.scrollTop = 0;
            }

            function resolvePath(base, relative) {
                const stack = base.split("/").filter(p => p.length > 0);
                const parts = relative.split("/");
                for (const part of parts) {
                    if (part === ".") continue;
                    if (part === "..") {
                        if (stack.length > 0) stack.pop();
                    } else {
                        stack.push(part);
                    }
                }
                return stack.join("/");
            }
        });
    </script>
</body>
</html>
