<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile ePub Reader</title>
    
    <!-- JSZip for extracting EPUB ZIP archives -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Slide-out Chapter Drawer Overlay -->
    <div id="drawerBackdrop" class="drawer-backdrop"></div>
    
    <aside id="tocDrawer" class="toc-drawer">
        <div class="drawer-header">
            <h3>Chapters</h3>
            <button id="closeDrawerBtn" class="close-btn">✕</button>
        </div>
        <div id="tocList" class="toc-list">
            <p class="empty-msg">No chapters loaded.</p>
        </div>
    </aside>

    <!-- Top Action Bar -->
    <header class="top-bar">
        <button id="openDrawerBtn" class="bar-btn" aria-label="Open Table of Contents">
            ☰
        </button>
        <span id="bookTitle" class="title-text">Mobile ePub Reader</span>
        <label class="upload-btn">
            Open
            <input type="file" id="epubInput" accept=".epub">
        </label>
    </header>

    <!-- Main Infinite Scroll Area -->
    <main id="scrollContainer" class="scroll-container">
        <!-- Empty Landing State -->
        <div id="emptyState" class="empty-state">
            <div class="icon">📖</div>
            <h2>Tap "Open" to Load an ePub</h2>
            <p>Renders continuous vertical scrolling optimized for mobile.</p>
        </div>

        <!-- Rendered Chapters Container -->
        <div id="bookContent" class="book-content hidden"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
